<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>edge_rl_3 — مسیر توسعه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="chart.umd.min.js"></script>
<style>
  :root{
    --bg: #F5F6F3;
    --surface: #FFFFFF;
    --surface-2: #ECEEE9;
    --line: #DCDFD8;
    --ink: #14213D;
    --ink-soft: #4A5468;
    --muted: #7A8496;
    --teal: #0F6E63;
    --teal-soft: #E3EFEC;
    --rust: #B5442E;
    --rust-soft: #F7E7E2;
    --amber: #C6900F;
    --amber-soft: #FBF0DA;
    --navy: #14213D;
    --navy-soft: #E7E9EF;
    --term-bg: #1B2130;
    --term-line: #2B3247;
    --add: #6FCF97;
    --remove: #F2836B;
    --radius: 18px;
    --font-fa: 'Vazirmatn', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%; width:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-fa);
    overflow:hidden;
  }
  .deck{
    position:relative;
    width:100vw; height:100vh;
  }
  .slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding: 54px 72px 84px 72px;
    opacity:0; pointer-events:none;
    transform: translateY(14px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .slide.active{ opacity:1; pointer-events:auto; transform:translateY(0); }

  /* ---------- shared bits ---------- */
  .eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.06em;
    color:var(--teal); background:var(--teal-soft);
    padding:6px 14px; border-radius:999px; width:fit-content;
    font-weight:600;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);}
  .eyebrow.warn{ color:var(--amber); background:var(--amber-soft);}
  .eyebrow.warn .dot{background:var(--amber);}
  .eyebrow.crit{ color:var(--rust); background:var(--rust-soft);}
  .eyebrow.crit .dot{background:var(--rust);}

  h1.slide-title{
    font-size:38px; font-weight:800; margin-top:16px; line-height:1.35;
    color:var(--ink);
  }
  p.slide-sub{
    font-size:17px; color:var(--ink-soft); margin-top:10px; max-width:900px;
    line-height:1.9; font-weight:500;
  }
  .body-row{
    display:flex; gap:36px; margin-top:30px; flex:1; min-height:0;
  }
  .col{ flex:1; min-width:0; display:flex; flex-direction:column; gap:16px;}

  /* ---------- diff / terminal card ---------- */
  .diff-card{
    background:var(--term-bg); border-radius:var(--radius);
    padding:20px 22px; flex:1; display:flex; flex-direction:column;
    box-shadow: 0 18px 40px -18px rgba(20,33,61,.5);
  }
  .diff-card .win-bar{
    display:flex; gap:7px; margin-bottom:16px;
  }
  .win-bar span{ width:10px; height:10px; border-radius:50%; }
  .win-bar span:nth-child(1){background:#F2836B;}
  .win-bar span:nth-child(2){background:#E3B341;}
  .win-bar span:nth-child(3){background:#6FCF97;}
  .diff-card .diff-label{
    font-family:var(--font-mono); font-size:11px; color:#7C88A8;
    letter-spacing:.08em; margin-bottom:4px; margin-top:14px;
  }
  .diff-card .diff-label:first-of-type{margin-top:0;}
  .diff-line{
    font-family:var(--font-mono); direction:ltr; text-align:left;
    font-size:13.5px; line-height:1.85; padding:2px 10px; border-radius:6px;
  }
  .diff-line.remove{ color:var(--remove); }
  .diff-line.remove::before{content:"- "; opacity:.75;}
  .diff-line.add{ color:var(--add); }
  .diff-line.add::before{content:"+ "; opacity:.75;}
  .diff-line.ctx{ color:#9AA6C4; }
  .diff-note{
    direction:rtl; text-align:right; font-family:var(--font-fa);
    color:#C4CBE0; font-size:14px; line-height:1.9; margin-top:14px;
    padding-top:14px; border-top:1px dashed #384061;
  }

  /* ---------- visual col ---------- */
  .visual-card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:20px 22px; flex:1;
    display:flex; flex-direction:column; min-height:0;
  }
  .visual-card .vc-title{
    font-size:14px; font-weight:700; color:var(--ink-soft); margin-bottom:10px;
  }
  .chart-wrap{ flex:1; position:relative; min-height:0; }

  /* ---------- stat ---------- */
  .stat-hero{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    flex:1; text-align:center; gap:8px;
  }
  .stat-hero .num{
    font-family:var(--font-mono); font-weight:700; font-size:64px; color:var(--rust);
    line-height:1;
  }
  .stat-hero .num.good{color:var(--teal);}
  .stat-hero .lbl{ font-size:16px; color:var(--ink-soft); font-weight:600; max-width:420px;}
  .stat-row{ display:flex; gap:14px; margin-top:10px; }
  .mini-stat{
    background:var(--surface-2); border-radius:12px; padding:10px 16px; text-align:center;
    flex:1;
  }
  .mini-stat .n{font-family:var(--font-mono); font-weight:700; font-size:20px;}
  .mini-stat .l{font-size:12px; color:var(--muted); margin-top:2px;}

  /* ---------- card grid ---------- */
  .card-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:16px; flex:1; align-content:start;
  }
  .info-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; display:flex; flex-direction:column; gap:8px;
  }
  .info-card .ic-num{
    font-family:var(--font-mono); font-size:12px; color:var(--teal); font-weight:700;
  }
  .info-card .ic-title{ font-size:15px; font-weight:700; color:var(--ink); line-height:1.5;}
  .info-card .ic-body{ font-size:13px; color:var(--ink-soft); line-height:1.75;}
  .info-card.crit{border-color:#E8C3B7;}
  .info-card.crit .ic-num{color:var(--rust);}
  .info-card.warn{border-color:#E9D6A3;}
  .info-card.warn .ic-num{color:var(--amber);}

  /* ---------- timeline (agenda) ---------- */
  .roadmap{
    flex:1; display:flex; align-items:center; position:relative; padding:0 10px;
  }
  .roadmap .track{
    position:absolute; top:50%; right:6%; left:6%; height:2px; background:var(--line); transform:translateY(-50%);
  }
  .roadmap .steps{ display:flex; justify-content:space-between; width:100%; position:relative; z-index:1;}
  .rstep{ display:flex; flex-direction:column; align-items:center; gap:10px; width:9.5%; }
  .rstep .node{
    width:34px; height:34px; border-radius:50%; background:var(--surface);
    border:2.5px solid var(--teal); display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--teal);
  }
  .rstep.final .node{ background:var(--navy); border-color:var(--navy); color:#fff;}
  .rstep .rlabel{ font-size:11.5px; text-align:center; color:var(--ink-soft); font-weight:600; line-height:1.5;}

  /* ---------- status grid ---------- */
  .status-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:12px; flex:1; align-content:start; overflow:auto;
  }
  .status-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px 16px;
  }
  .status-row .sr-name{ font-family:var(--font-mono); font-size:13px; color:var(--ink); direction:ltr; text-align:left;}
  .status-row .sr-desc{ font-size:12px; color:var(--muted); margin-top:2px;}
  .badge{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;
    font-family:var(--font-mono);
  }
  .badge.ok{background:var(--teal-soft); color:var(--teal);}
  .badge.warn{background:var(--amber-soft); color:var(--amber);}
  .badge.crit{background:var(--rust-soft); color:var(--rust);}

  /* ---------- checklist ---------- */
  .checklist{ flex:1; display:flex; flex-direction:column; gap:10px; overflow:auto; }
  .check-item{
    display:flex; align-items:flex-start; gap:14px; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; padding:12px 16px;
  }
  .check-item .cnum{
    font-family:var(--font-mono); font-weight:700; font-size:13px;
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; color:#fff;
  }
  .check-item.crit .cnum{ background:var(--rust); }
  .check-item.norm .cnum{ background:var(--muted); }
  .check-item .ctext{ font-size:14px; color:var(--ink-soft); line-height:1.8; padding-top:2px;}

  /* ---------- legend ---------- */
  .legend{ display:flex; gap:18px; flex-wrap:wrap; }
  .legend .li{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-soft); font-weight:600;}
  .legend .sw{width:12px; height:12px; border-radius:4px;}

  /* ---------- nav ---------- */
  .nav{
    position:fixed; bottom:26px; left:0; right:0; display:flex; align-items:center;
    justify-content:center; gap:18px; z-index:50;
  }
  .navbtn{
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 8px 20px -10px rgba(20,33,61,.3); font-size:18px;
    transition:.15s;
  }
  .navbtn:hover{ background:var(--navy); color:#fff; }
  .navbtn:disabled{ opacity:.3; cursor:default; }
  .navbtn:disabled:hover{ background:var(--surface); color:var(--ink);}
  .progress-dots{ display:flex; gap:6px; align-items:center; }
  .pdot{ width:7px; height:7px; border-radius:50%; background:var(--line); cursor:pointer; transition:.2s;}
  .pdot.active{ background:var(--teal); width:20px; border-radius:4px; }
  .counter{
    position:fixed; bottom:30px; left:36px; font-family:var(--font-mono); font-size:12px; color:var(--muted); z-index:50;
  }
  .topbrand{
    position:fixed; top:24px; left:36px; font-family:var(--font-mono); font-size:11px;
    color:var(--muted); letter-spacing:.08em; z-index:50; direction:ltr;
  }

  /* ---------- title slide ---------- */
  .title-slide{ align-items:center; justify-content:center; text-align:center; padding-top:0; }
  .title-slide .kicker{
    font-family:var(--font-mono); color:var(--teal); font-size:14px; letter-spacing:.15em;
    background:var(--teal-soft); padding:8px 20px; border-radius:999px; margin-bottom:26px;
  }
  .title-slide h1{ font-size:64px; font-weight:900; color:var(--ink); line-height:1.2;}
  .title-slide .accent{ color:var(--teal); }
  .title-slide p{ font-size:19px; color:var(--ink-soft); margin-top:22px; max-width:720px; font-weight:500; line-height:1.9;}
  .title-slide .stats{ display:flex; gap:40px; margin-top:48px; }
  .title-slide .stats .s{ text-align:center; }
  .title-slide .stats .s .n{ font-family:var(--font-mono); font-size:30px; font-weight:800; color:var(--navy);}
  .title-slide .stats .s .l{ font-size:12.5px; color:var(--muted); margin-top:4px; font-weight:600;}

  /* closing */
  .closing{ align-items:center; justify-content:center; text-align:center; }
  .closing h1{ font-size:46px; font-weight:800; color:var(--ink); }
  .closing p{ font-size:17px; color:var(--ink-soft); margin-top:16px; max-width:640px; line-height:1.9;}

  code.inline{ font-family:var(--font-mono); background:var(--surface-2); padding:2px 7px; border-radius:6px; font-size:.92em; direction:ltr; display:inline-block;}
</style>
</head>
<body>
<div class="topbrand">EDGE_RL_3 · CHANGELOG</div>
<div class="deck" id="deck"></div>
<div class="nav">
  <button class="navbtn" id="btnNext" title="بعدی">‹</button>
  <div class="progress-dots" id="dots"></div>
  <button class="navbtn" id="btnPrev" title="قبلی">›</button>
</div>
<div class="counter" id="counter">۱ / ۱۶</div>

<script>
const toFa = n => String(n).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

/* =====================  SLIDES DATA/HTML  ===================== */
const slides = [];

/* ---------- 1. Title ---------- */
slides.push(`
<div class="slide title-slide">
  <div class="kicker">CHANGELOG.md · مستند توسعه</div>
  <h1>پروژه <span class="accent">edge_rl_3</span><br>مسیر کامل از Baseline تا نسخه‌ی نهایی</h1>
  <p>روایتی گام‌به‌گام از کشف باگ‌ها، اصلاح‌ها و نتایج تأییدشده — از سه الگوریتم قاعده‌محور اولیه تا یک عامل PPO آموزش‌دیده که در هر ۴ معیار اصلی برنده شد.</p>
  <div class="stats">
    <div class="s"><div class="n">۱۱</div><div class="l">گام توسعه</div></div>
    <div class="s"><div class="n">۴</div><div class="l">الگوریتم</div></div>
    <div class="s"><div class="n">+۱۵</div><div class="l">باگ کشف و رفع‌شده</div></div>
    <div class="s"><div class="n">۴</div><div class="l">مورد باز بحرانی</div></div>
  </div>
</div>`);

/* ---------- 2. Roadmap ---------- */
slides.push(`
<div class="slide">
  <div class="eyebrow"><span class="dot"></span> نقشه‌ی راه</div>
  <h1 class="slide-title">مسیر ۱۰ گام تا نسخه‌ی نهایی</h1>
  <p class="slide-sub">هر گام شامل زمینه، مشکل کشف‌شده، علت ریشه‌ای، اصلاح اعمال‌شده و نتیجه‌ی تأییدشده است.</p>
  <div class="roadmap">
    <div class="track"></div>
    <div class="steps">
      <div class="rstep"><div class="node">۰</div><div class="rlabel">Baseline</div></div>
      <div class="rstep"><div class="node">۱</div><div class="rlabel">بازبینی معماری</div></div>
      <div class="rstep"><div class="node">۲</div><div class="rlabel">اولین PPO</div></div>
      <div class="rstep"><div class="node">۳</div><div class="rlabel">Capacity-Starved</div></div>
      <div class="rstep"><div class="node">۴</div><div class="rlabel">Flapping</div></div>
      <div class="rstep"><div class="node">۵</div><div class="rlabel">Seed-Sweep</div></div>
      <div class="rstep"><div class="node">۶</div><div class="rlabel">تنظیم Reward</div></div>
      <div class="rstep"><div class="node">۷</div><div class="rlabel">Voila</div></div>
      <div class="rstep"><div class="node">۸</div><div class="rlabel">k8s Adapter</div></div>
      <div class="rstep"><div class="node">۹</div><div class="rlabel">بازبینی نهایی</div></div>
      <div class="rstep final"><div class="node">۱۰</div><div class="rlabel">مستندات نهایی</div></div>
    </div>
  </div>
  <div class="legend" style="margin-top:20px;">
    <div class="li"><span class="sw" style="background:var(--navy)"></span> Greedy</div>
    <div class="li"><span class="sw" style="background:var(--teal)"></span> Voila</div>
    <div class="li"><span class="sw" style="background:var(--amber)"></span> HPA</div>
    <div class="li"><span class="sw" style="background:var(--rust)"></span> PPO</div>
  </div>
</div>`);

/* ---------- 3. Step 0 baseline ---------- */
slides.push(`
<div class="slide">
  <div class="eyebrow"><span class="dot"></span> گام ۰۰ · نقطه‌ی شروع</div>
  <h1 class="slide-title">Baseline بدون PPO</h1>
  <p class="slide-sub">سه الگوریتم قاعده‌محور — Greedy، Voila و HPA — برای اولین‌بار روی Data4.csv اجرا شدند تا خط پایه‌ی مقایسه ساخته شود.</p>
  <div class="body-row">
    <div class="col">
      <div class="visual-card">
        <div class="vc-title">میانگین زمان پاسخ‌دهی (ثانیه)</div>
        <div class="chart-wrap"><canvas id="c0a"></canvas></div>
      </div>
    </div>
    <div class="col">
      <div class="visual-card">
        <div class="vc-title">نرخ نقض deadline (درصد)</div>
        <div class="chart-wrap"><canvas id="c0b"></canvas></div>
      </div>
    </div>
    <div class="col" style="flex:0.8;">
      <div class="diff-card">
        <div class="win-bar"><span></span><span></span><span></span></div>
        <div class="diff-label">⚠ هشدار</div>
        <div class="diff-note" style="margin-top:0; border-top:none; padding-top:0;">
          این baseline بعداً معلوم شد محصول چند باگ سیستمی بوده. مقایسه‌ی مستقیم این اعداد با نسخه‌ی نهایی گمراه‌کننده است.
        </div>
      </div>
    </div>
  </div>
</div>`);

/* ---------- 4. Step 1 architecture review ---------- */
slides.push(`
<div class="slide">
  <div class="eyebrow"><span class="dot"></span> گام ۰۱ · بازبینی معماری</div>
  <h1 class="slide-title">بازبینی کامل کد در برابر سند ۱۳-بخشی</h1>
  <p class="slide-sub">اکثر بخش‌ها (۱ تا ۱۱) درست پیاده شده بودند، اما چند نقص مهم و چند ادعای کهنه در مستندات پیدا شد.</p>
  <div class="card-grid">
    <div class="info-card crit">
      <div class="ic-num">نقص ۰۱</div>
      <div class="ic-title">باگ متریک distance/delay</div>
      <div class="ic-body">مقدار صفر برای درخواست‌های رد‌شده هم append می‌شد. فیکس: فقط برای <code class="inline">COMPLETED</code>.</div>
    </div>
    <div class="info-card warn">
      <div class="ic-num">نقص ۰۲</div>
      <div class="ic-title">نقص Audit Trail</div>
      <div class="ic-body">رویدادهای <code class="inline">request_routed</code> و <code class="inline">request_queued</code> لاگ نمی‌شدند.</div>
    </div>
    <div class="info-card crit">
      <div class="ic-num">نقص ۰۳</div>
      <div class="ic-title">Emergency-Boot پیاده نشده</div>
      <div class="ic-body">در یک اجرای PPO باعث ۵۱۰ تلاش شکست‌خورده‌ی پیاپی روی همان سرور شد.</div>
    </div>
    <div class="info-card warn">
      <div class="ic-num">نقص ۰۴</div>
      <div class="ic-title">نقص پورتابیلیتی</div>
      <div class="ic-body">مسیر دادهٔ هاردکد ویندوزی؛ فیکس با <code class="inline">EOTCH_DATA_DIR</code>.</div>
    </div>
    <div class="info-card">
      <div class="ic-num">نقص ۰۵</div>
      <div class="ic-title">دو ادعای کهنه در README</div>
      <div class="ic-body">مستندسازی به‌طور مکرر عقب‌تر از کد ماند — الگویی که در سراسر پروژه تکرار شد.</div>
    </div>
  </div>
</div>`);

/* ---------- 5. Step 2 first PPO ---------- */
slides.push(`
<div class="slide">
  <div class="eyebrow crit"><span class="dot"></span> گام ۰۲ · اولین ارزیابی واقعی PPO</div>
  <h1 class="slide-title">باگ Reward نرمال‌نشده، عامل را فلج کرد</h1>
  <p class="slide-sub">جریمه‌ی «درخواست ردشده» جدا و نرمال‌نشده اعمال می‌شد و در تیک‌های شلوغ کل سیگنال reward را تحت‌الشعاع قرار می‌داد.</p>
  <div class="body-row">
    <div class="col" style="flex:1.1;">
      <div class="diff-card">
        <div class="win-bar"><span></span><span></span><span></span></div>
        <div class="diff-label">مشکل</div>
        <div class="diff-line remove">PPO_PENALTY_PER_REJECTED  # جدا و نرمال‌نشده</div>
        <div class="diff-label">فیکس</div>
        <div class="diff-line add">num_rejected_recent → normalize [0,2]</div>
        <div class="diff-line add">w5_rejected * norm_rejected  # در جمع وزن‌دار reward</div>
        <div class="diff-note">نتیجه: عامل یاد گرفته بود تقریباً هیچ اکشنی نزند و فقط سرور اضافه نگه دارد.</div>
      </div>
    </div>
    <div class="col">
      <div class="visual-card">
        <div class="vc-title">تعداد کل اکشن PPO در روز — قبل / بعد از فیکس</div>
        <div class="chart-wrap"><canvas id="c2a"></canvas></div>

/* =====================  RENDER + NAV  ===================== */
const deck = document.getElementById('deck');
slides.forEach((html, i) => {
  const wrap = document.createElement('div');
  wrap.innerHTML = html.trim();
  const el = wrap.firstElementChild;
  el.dataset.index = i;
  deck.appendChild(el);
});
const slideEls = Array.from(document.querySelectorAll('.slide'));
const dotsWrap = document.getElementById('dots');
slideEls.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'pdot';
  d.addEventListener('click', () => go(i));
  dotsWrap.appendChild(d);
});
const dotEls = Array.from(dotsWrap.children);
let current = 0;
function render(){
  slideEls.forEach((el,i)=> el.classList.toggle('active', i===current));
  dotEls.forEach((d,i)=> d.classList.toggle('active', i===current));
  document.getElementById('counter').textContent = toFa(current+1) + ' / ' + toFa(slideEls.length);
  document.getElementById('btnNext').disabled = current === slideEls.length-1;
  document.getElementById('btnPrev').disabled = current === 0;
}
function go(i){
  current = Math.max(0, Math.min(slideEls.length-1, i));
  render();
}
document.getElementById('btnNext').addEventListener('click', ()=> go(current+1));
document.getElementById('btnPrev').addEventListener('click', ()=> go(current-1));
window.addEventListener('keydown', e=>{
  if(e.key === 'ArrowLeft') go(current+1);
  else if(e.key === 'ArrowRight') go(current-1);
  else if(e.key === ' '){ e.preventDefault(); go(current+1); }
});
render();
